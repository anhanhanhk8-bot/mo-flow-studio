<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Mo Flow Studio — Tạo kịch bản Google Flow</title>
<style>
:root{font-family:'Segoe UI',Tahoma,Arial,sans-serif;color:#202a3c;background:#f6f7fb;font-size:13px}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}a{color:inherit;text-decoration:none}.app{display:flex;min-height:100vh}.side{width:245px;min-width:245px;background:#131b2b;color:#b0bdd1;padding:26px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:11px;color:white;margin:2px 9px 42px}.logo{width:40px;height:40px;background:#ff6d50;border-radius:13px;display:grid;place-items:center;font-size:23px;box-shadow:0 10px 23px #ff6e5040}.brand b{font-size:20px;letter-spacing:-1px}.brand small{font-size:9px;letter-spacing:2px;color:#8290a7}.side-label{font-size:10px;font-weight:800;letter-spacing:2px;color:#76869f;margin:10px 13px}.nav{width:100%;background:transparent;color:#abb7cb;border:0;text-align:left;border-radius:10px;padding:13px 14px;margin:3px 0;display:flex;align-items:center;gap:12px;font-weight:700}.nav.active,.nav:hover{background:#29344a;color:white}.side-tip{margin-top:auto;border:1px solid #344157;background:#1b273a;border-radius:14px;padding:17px;line-height:1.7;color:#9fb0c9;font-size:11px}.side-tip b{display:block;color:white;margin-bottom:6px}.side-foot{color:#7e8ca5;font-size:10px;margin:20px 8px 0}.main{flex:1;min-width:0}.top{height:75px;background:white;border-bottom:1px solid #e7eaf0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 38px}.crumb{color:#929dab;font-size:12px;font-weight:700}.crumb strong{color:#2b3549}.topright{display:flex;gap:10px;align-items:center}.saved{font-size:11px;color:#309c77;margin-right:9px}.btn{border:1px solid #e4e7ef;border-radius:10px;padding:10px 14px;background:white;color:#475365;font-size:12px;font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn:hover{filter:brightness(.97)}.btn.primary{color:white;background:#ff6c51;border-color:#ff6c51;box-shadow:0 5px 15px #ff6c5131}.btn.dark{color:white;background:#27354b;border-color:#27354b}.btn.mini{font-size:11px;padding:7px 10px}.btn.light{color:#e96c4e;background:#fff3ef;border-color:#ffded3}.content{padding:35px 37px 65px;max-width:1510px;margin:auto}.eyebrow{color:#f57155;font-size:10px;letter-spacing:2px;font-weight:900;margin-bottom:8px}.heading{font-size:29px;font-weight:850;letter-spacing:-.9px;margin:0}.subheading{margin:9px 0 28px;color:#98a2b1;font-size:12px;line-height:1.7}.cols{display:grid;grid-template-columns:minmax(300px,370px) minmax(460px,1fr);gap:22px;align-items:start}.stack{display:grid;gap:20px}.panel{background:white;border:1px solid #e6eaf0;border-radius:17px;overflow:hidden;box-shadow:0 4px 17px #10284306}.panel-head{padding:20px 22px;border-bottom:1px solid #f0f1f5;display:flex;align-items:center;gap:12px}.number{font-size:11px;font-weight:900;color:#ed6c4f;background:#fff0eb;padding:7px 9px;border-radius:8px}.panel-head h2{font-size:14px;margin:0}.panel-head p{color:#a4aeba;font-size:11px;margin:5px 0 0}.panel-body{padding:21px 22px}.field{display:grid;gap:8px;margin-bottom:16px}.field:last-child{margin-bottom:0}.field>label{font-size:11px;color:#5c6679;font-weight:800}.field input[type=text],.field select,.field textarea,.field input[type=number]{background:#fbfcfe;border:1px solid #e2e7ef;border-radius:9px;padding:11px 12px;min-width:0;width:100%;color:#303a4e;outline:0;font-size:12px}.field input:focus,.field select:focus,.field textarea:focus{border-color:#ff9a84;background:white}.field textarea{min-height:77px;resize:vertical;line-height:1.7}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pickers{display:flex;gap:9px}.pill{flex:1;padding:10px 8px;border-radius:9px;border:1px solid #e3e8ef;background:#fff;color:#8a96a7;font-size:11px;font-weight:800}.pill.active{color:#ef6f51;background:#fff0e9;border-color:#ffa28e}.drop{border:1.5px dashed #d4dce8;border-radius:10px;padding:15px 11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:#fafbfe;position:relative;min-height:90px;text-align:center}.drop:hover{border-color:#fc8b76;background:#fff8f5}.drop strong{font-size:11px;color:#616e82}.drop span{font-size:10px;color:#a8b3c1}.drop .symbol{font-size:23px;color:#fc846d}.drop input{position:absolute;inset:0;cursor:pointer;opacity:0;width:100%;height:100%}.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}.thumb{height:66px;width:66px;border:1px solid #e3e9f0;border-radius:9px;overflow:hidden;position:relative}.thumb img{height:100%;width:100%;object-fit:cover}.thumb button{position:absolute;right:2px;top:2px;border:0;border-radius:5px;background:#1d293acf;color:white;padding:2px 5px}.scene-tabs{padding:18px 21px 0;display:flex;flex-wrap:wrap;gap:8px}.scene-tab{border:1px solid #edf0f3;background:#f4f6f9;color:#8a96a7;padding:11px 14px;border-radius:9px;font-size:11px;font-weight:800}.scene-tab.active{background:#fff0eb;border-color:#ffd2c5;color:#ee6a50}.scene-count{margin-left:auto;font-size:11px;color:#91a0b0}.scene-inner{padding:21px}.scene-title{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:18px}.scene-title strong{font-size:15px}.scene-title p{margin:5px 0 0;color:#abb4c0;font-size:11px}.tip{border:1px solid #dfefe8;background:#eff9f5;color:#63937e;padding:12px 13px;font-size:11px;border-radius:10px;line-height:1.7}.frames{display:grid;grid-template-columns:1fr 1fr;gap:12px}.frame{min-height:115px;border:1.5px dashed #dae1eb;background:#f9fafd;border-radius:11px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:#98a6b7;font-size:11px;overflow:hidden}.frame img{width:100%;height:114px;object-fit:cover}.frame input{position:absolute;inset:0;opacity:0;cursor:pointer}.frame-label{font-size:11px;color:#607082;font-weight:800;margin:0 0 9px}.frame-actions{display:flex;justify-content:flex-end;margin-top:5px;min-height:22px}.linkbtn{border:0;background:transparent;font-size:11px;color:#ec7a64}.prompt{border:1px solid #e7ebf1;border-radius:11px;overflow:hidden;background:#f8fafc;margin-top:20px}.prompt-head{padding:13px 15px;border-bottom:1px solid #e6e9ef;display:flex;justify-content:space-between;align-items:center;gap:12px}.prompt-head strong{font-size:11px;color:#47556a}.prompt textarea{border:0;outline:0;padding:15px;background:transparent;color:#657286;font:11px/1.7 Consolas,monospace;width:100%;min-height:240px;resize:vertical}.prompt-foot{padding:12px 15px;border-top:1px solid #e9ebf1;display:flex;align-items:center;justify-content:space-between;gap:9px}.row-actions{display:flex;gap:8px;flex-wrap:wrap}.banner{margin-top:22px;border-radius:15px;background:linear-gradient(110deg,#1b2b42,#182236);color:white;padding:20px 23px;display:flex;align-items:center;justify-content:space-between;gap:14px}.banner strong{display:block;font-size:14px}.banner span{display:block;font-size:11px;color:#b7c3d0;margin-top:6px;line-height:1.6}.project-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:white;border:1px solid #e6eaf0;border-radius:13px;padding:19px;margin:0 0 11px}.project-row h3{font-size:14px;margin:0}.project-row p{color:#97a3b2;font-size:11px;margin:6px 0 0}.muted{color:#97a4b5;font-size:11px;line-height:1.7}.guide-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.guide{background:white;border:1px solid #e5eaf0;padding:22px;border-radius:14px}.guide h3{font-size:13px}.guide p{font-size:11px;color:#8f9aa9;line-height:1.8}.guide-number{display:inline-flex;width:32px;height:32px;border-radius:10px;background:#fff1ed;color:#ef765b;align-items:center;justify-content:center;font-weight:800}.toast{position:fixed;bottom:22px;right:22px;padding:13px 18px;background:#253349;color:white;font-size:12px;border-radius:12px;box-shadow:0 10px 25px #17223e40;z-index:99}.mobile-nav{display:none}.hidden{display:none!important}@media(max-width:1180px){.side{width:195px;min-width:195px}.content{padding:26px 21px}.top{padding:0 20px}.cols{grid-template-columns:minmax(265px,325px) minmax(370px,1fr)}}@media(max-width:970px){.cols{grid-template-columns:1fr}.stack.left{grid-template-columns:1fr 1fr;align-items:start}.stack.left .panel:first-child{grid-column:span 2}}@media(max-width:750px){.side{display:none}.mobile-nav{display:flex;background:#131b2b;padding:14px;gap:7px;align-items:center}.mobile-nav button{background:#29374e;color:white;border:1px solid #455167;border-radius:7px;padding:8px 10px;font-size:11px}.mobile-nav b{margin-right:auto;color:white;font-size:15px}.top{height:59px;padding:0 14px}.saved,.top .btn.secondary{display:none}.content{padding:22px 14px}.heading{font-size:23px}.cols{grid-template-columns:1fr}.stack.left{display:grid;grid-template-columns:1fr}.stack.left .panel:first-child{grid-column:1}.panel-head,.panel-body,.scene-inner{padding:17px}.scene-tabs{padding:16px}.scene-tab{padding:9px;font-size:10px}.split,.guide-grid{grid-template-columns:1fr}.banner{flex-direction:column;align-items:flex-start}.topright{gap:5px}.scene-title{align-items:flex-start;flex-direction:column}}
</style></head><body><div id="root"></div>
<script>
(()=>{'use strict';
const FLOW='https://flow.google.com/';
const TITLES=['Mở đầu ấn tượng','Cận cảnh chi tiết','Trải nghiệm thực tế','Kết thúc tự nhiên'];
const ACTIONS=['Nhân vật giới thiệu sản phẩm tự nhiên trước ống kính. Giữ đúng hình dạng sản phẩm.','Quay cận cảnh sản phẩm với các chi tiết và màu sắc đúng ảnh tham chiếu.','Nhân vật sử dụng sản phẩm trong sinh hoạt hằng ngày. Không tự thêm vật phẩm.','Nhân vật mỉm cười, cầm sản phẩm đúng như ảnh gốc và kết thúc nhẹ nhàng.'];
const SHOTS=['Trung cảnh, ánh sáng tự nhiên, camera chuyển động nhẹ.','Cận cảnh chi tiết sản phẩm, chuyển góc máy mượt.','Góc qua vai và trung cảnh, chuyển động tay chân tự nhiên.','Khung hình sản phẩm rõ ràng, máy quay tiến rất nhẹ.'];
const LINES=['Hôm nay mình có một món đồ hay muốn giới thiệu với mọi người.','Thiết kế nhỏ gọn, chi tiết rõ ràng và rất dễ sử dụng.','Dùng trong sinh hoạt hằng ngày thì thấy khá tiện lợi.','Nếu thấy hợp nhu cầu, mọi người có thể tham khảo nhé.'];
const VOICES={'none':'No speaking and no narration. Natural ambient sounds only if supported.','male-natural':'Vietnamese male voice, young, clear, warm, natural conversational style, not exaggerated.','male-warm':'Vietnamese male voice, low and warm, clear, friendly delivery.','female-natural':'Vietnamese female voice, young, friendly, natural conversational delivery.','female-soft':'Vietnamese female voice, gentle warm tone, clear natural pronunciation.'};
const VOICE_OPTS=[['male-natural','Nam trẻ · tự nhiên'],['male-warm','Nam · trầm ấm'],['female-natural','Nữ trẻ · tự nhiên'],['female-soft','Nữ · nhẹ nhàng'],['none','Không lời thoại']];
const STYLES=['Đời thường','Chân thực','Điện ảnh','Quảng cáo'];
const GOALS=['Review sản phẩm','Quảng cáo','Giới thiệu áo thun','Video đời thường'];
const uid=()=>Math.random().toString(36).slice(2,11);
const scene=i=>({id:uid(),title:TITLES[i],action:ACTIONS[i],shot:SHOTS[i],dialogue:LINES[i],first:'',last:'',custom:''});
function makeProject(name='Dự án mới'){return{id:uid(),name,product:'',description:'',preserve:'Giữ nguyên khuôn mặt, màu sắc, tỷ lệ và số lượng sản phẩm. Không thêm người, tay hoặc đồ vật khác.',goal:GOALS[0],aspect:'9:16',count:4,duration:8,voice:'male-natural',style:STYLES[0],products:[],characters:[],scenes:[0,1,2,3].map(scene),updated:Date.now()};}
function makeSample(){const p=makeProject('Review quạt cầm tay');p.product='Quạt mini cầm tay';p.description='Quạt cầm tay nhỏ gọn, dễ mang theo khi đi làm hoặc đi chơi. Thể hiện tình huống sử dụng thật.';p.preserve='Quạt đúng màu, kích thước và hình dạng theo ảnh sản phẩm; không tự thêm quạt thứ hai, không phóng quạt quá lớn.';return p;}
let projects=[],active='',sceneIdx=0,view='studio',persist='Chưa lưu';
let db=null;let saveTimer=0;let toastTimer=0;
const $=sel=>document.querySelector(sel);
function escapeHtml(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');}
function project(){return projects.find(p=>p.id===active)||projects[0];}
function current(){return project()?.scenes[sceneIdx]||project()?.scenes[0];}
function options(list,val){return list.map(x=>`<option ${x===val?'selected':''}>${escapeHtml(x)}</option>`).join('');}
function voiceOptions(val){return VOICE_OPTS.map(([k,v])=>`<option value="${k}" ${k===val?'selected':''}>${v}</option>`).join('');}
function promptFor(p,s,i){if(s.custom?.trim())return s.custom;let lines=[`SCENE ${i+1}/${p.count}: ${s.title}`,`Create a realistic ${p.duration}-second video in ${p.aspect} aspect ratio. Purpose: ${p.goal}.`, `PRODUCT: ${p.product||'Use uploaded product reference image.'}`,`PRODUCT DESCRIPTION: ${p.description||'Match the reference product exactly.'}`,`ACTION: ${s.action}`,`CAMERA: ${s.shot}`,`STYLE: ${p.style}. Natural realistic movements and plausible human anatomy.`,`STRICT REFERENCE CONSISTENCY: Use uploaded character and product images as the source of truth. Keep the exact same face, hair, clothing, product shape, proportions, markings and color throughout. No extra hands, no duplicate cups, no extra products, no unrequested props.`,`DO NOT CHANGE: ${p.preserve}`,`IMAGES: ${s.first?'A first-frame photo is provided in Google Flow.':'Use product/character references where supported.'} ${s.last?'A final-frame photo is provided in Google Flow. Preserve plausible transition.':''}`,`AUDIO: ${VOICES[p.voice]}`];if(p.voice!=='none')lines.push(`EXACT VIETNAMESE DIALOGUE: "${s.dialogue}". Do not translate this dialogue into English.`);lines.push('No invented subtitles, captions, logos or on-screen text.');return lines.join('\n\n');}
function allPrompts(p){return [`MO FLOW STUDIO — ${p.name}`,`Sản phẩm: ${p.product||'Chưa đặt tên'}`,`Tỷ lệ: ${p.aspect} — ${p.duration} giây × ${p.count} cảnh`,...p.scenes.map((s,i)=>`\n========== CẢNH ${i+1} ==========\n${promptFor(p,s,i)}`)].join('\n');}
async function openDb(){return new Promise((res,rej)=>{if(!('indexedDB' in window))return rej(new Error('no indexedDB'));const r=indexedDB.open('mo_flow_offline_db',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('saved'))r.result.createObjectStore('saved')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function dbRead(){return new Promise((res,rej)=>{const t=db.transaction('saved','readonly'),r=t.objectStore('saved').get('data');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function dbWrite(){return new Promise((res,rej)=>{const t=db.transaction('saved','readwrite');t.objectStore('saved').put({projects,active},'data');t.oncomplete=res;t.onerror=()=>rej(t.error);});}
async function save(){try{if(db){await dbWrite();persist='Đã lưu trên máy';}else{localStorage.setItem('moFlowOffline',JSON.stringify({projects,active}));persist='Đã lưu cục bộ';}}catch(e){persist='Chưa thể lưu';showToast('Không lưu được: có thể bộ nhớ trình duyệt đã đầy. Hãy xuất JSON để sao lưu.');}const label=$('#save-status');if(label)label.textContent='● '+persist;}
function queueSave(){persist='Đang lưu...';const label=$('#save-status');if(label)label.textContent='● '+persist;clearTimeout(saveTimer);saveTimer=setTimeout(save,500);}
function showToast(m){let el=$('#toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';document.body.append(el);}el.textContent=m;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),3600);}
function uploadPicker(title,which,multiple=true){return `<div class="drop"><div class="symbol">♧</div><strong>${title}</strong><span>Nhấn để thêm ảnh PNG / JPG</span><input type="file" accept="image/*" ${multiple?'multiple':''} data-upload="${which}" aria-label="${title}"></div>`;}
function thumbs(images,which){return images.length?`<div class="thumbs">${images.map((src,i)=>`<div class="thumb"><img src="${src}" alt="Ảnh ${i+1}"><button data-act="remove-image" data-which="${which}" data-i="${i}" title="Xóa ảnh">×</button></div>`).join('')}</div>`:'';}
function field(label,attr,value,rows=0){return `<div class="field"><label>${label}</label>${rows?`<textarea data-field="${attr}" rows="${rows}">${escapeHtml(value)}</textarea>`:`<input type="text" data-field="${attr}" value="${escapeHtml(value)}">`}</div>`;}
function frame(label,which,src){return `<div><p class="frame-label">${label}</p><div class="frame">${src?`<img src="${src}" alt="${label}">`:'<div style="font-size:24px">▧</div><span>Thêm ảnh</span>'}<input type="file" accept="image/*" data-upload="${which}" aria-label="${label}"></div><div class="frame-actions">${src?`<button class="linkbtn" data-act="clear-frame" data-which="${which}">Xóa ảnh</button>`:''}</div></div>`;}
function studio(){const p=project(),s=current();return `<div class="content"><div class="eyebrow">✦ AI VIDEO WORKSPACE</div><h1 class="heading">Tạo video thật dễ dàng <span style="color:#ff7256">✦</span></h1><p class="subheading">Chuẩn bị kịch bản, hình ảnh và prompt video cho Google Flow — không cần API trả phí.</p><div class="cols"><div class="stack left"><section class="panel"><div class="panel-head"><span class="number">01</span><div><h2>Thông tin dự án</h2><p>Điền thông tin để tạo prompt chính xác</p></div></div><div class="panel-body">${field('Tên dự án','name',p.name)}${field('Tên sản phẩm','product',p.product)}${field('Mô tả sản phẩm','description',p.description,3)}${field('Chi tiết phải giữ nguyên','preserve',p.preserve,3)}<div class="field"><label>Loại video</label><select data-field="goal">${options(GOALS,p.goal)}</select></div></div></section><section class="panel"><div class="panel-head"><span class="number">02</span><div><h2>Ảnh tham chiếu</h2><p>Giữ đúng mẫu và nhân vật</p></div></div><div class="panel-body"><div class="field"><label>Ảnh sản phẩm (${p.products.length})</label>${uploadPicker('Tải ảnh sản phẩm','products')}${thumbs(p.products,'products')}</div><div class="field" style="margin-top:21px"><label>Ảnh nhân vật (${p.characters.length})</label>${uploadPicker('Tải ảnh nhân vật','characters')}${thumbs(p.characters,'characters')}</div><div class="tip">🔒 Ảnh chỉ lưu trong trình duyệt này. Khi tạo video, mày cần tải ảnh gốc thủ công lên Google Flow.</div></div></section><section class="panel"><div class="panel-head"><span class="number">03</span><div><h2>Cấu hình video</h2><p>Chọn định dạng và giọng nói</p></div></div><div class="panel-body"><div class="field"><label>Tỷ lệ khung hình</label><div class="pickers"><button class="pill ${p.aspect==='9:16'?'active':''}" data-act="aspect" data-value="9:16">▯ 9:16 Dọc</button><button class="pill ${p.aspect==='16:9'?'active':''}" data-act="aspect" data-value="16:9">▭ 16:9 Ngang</button></div></div><div class="split"><div class="field"><label>Số cảnh</label><select data-field="count"><option value="3" ${p.count===3?'selected':''}>3 cảnh</option><option value="4" ${p.count===4?'selected':''}>4 cảnh</option></select></div><div class="field"><label>Thời lượng / cảnh</label><select data-field="duration"><option value="4" ${p.duration===4?'selected':''}>4 giây</option><option value="6" ${p.duration===6?'selected':''}>6 giây</option><option value="8" ${p.duration===8?'selected':''}>8 giây</option></select></div></div><div class="field"><label>Phong cách</label><select data-field="style">${options(STYLES,p.style)}</select></div><div class="field"><label>Giọng thoại</label><select data-field="voice">${voiceOptions(p.voice)}</select></div><div class="tip">🎙️ Đây là yêu cầu giọng trong prompt, không phải chức năng tạo giọng trực tiếp.</div></div></section></div><div class="stack right"><section class="panel"><div class="panel-head" style="justify-content:space-between"><div style="display:flex;align-items:center;gap:12px"><span class="number">04</span><div><h2>Kịch bản từng cảnh</h2><p>Điều chỉnh hành động, thoại và góc quay</p></div></div><span class="scene-count">${p.count} CẢNH · ${p.count*p.duration} GIÂY</span></div><div class="scene-tabs">${p.scenes.map((sc,i)=>`<button class="scene-tab ${sceneIdx===i?'active':''}" data-act="scene" data-i="${i}">▣ Cảnh ${i+1} · ${p.duration}s</button>`).join('')}</div><div class="scene-inner"><div class="scene-title"><div><strong>${escapeHtml(s.title)}</strong><p>Điều chỉnh cảnh ${sceneIdx+1} để khớp với sản phẩm</p></div><button class="btn mini" data-act="reset-prompt">↻ Tạo lại prompt</button></div>${field('Tiêu đề cảnh','scene.title',s.title)}${field('Hành động và sản phẩm','scene.action',s.action,3)}${field('Góc máy / chuyển động','scene.shot',s.shot,2)}${p.voice!=='none'?field('Lời thoại tiếng Việt (ngắn gọn)','scene.dialogue',s.dialogue,2):''}<div class="field"><label>Ảnh đầu / ảnh cuối <span style="font-weight:400;color:#abb6c3">(tùy chọn)</span></label><div class="frames">${frame('Ảnh đầu', 'first',s.first)}${frame('Ảnh cuối','last',s.last)}</div></div><div class="prompt"><div class="prompt-head"><strong>✨ PROMPT GOOGLE FLOW ${s.custom?'· Đã chỉnh tay':'· Tự động'}</strong><button class="btn mini light" data-act="copy-scene">◫ Copy prompt</button></div><textarea id="prompt-field" spellcheck="false" aria-label="Prompt Google Flow">${escapeHtml(promptFor(p,s,sceneIdx))}</textarea><div class="prompt-foot"><span class="muted">Có thể chỉnh trực tiếp prompt</span><div class="row-actions"><button class="btn mini" data-act="copy-all">Copy tất cả</button><button class="btn mini primary" data-act="flow">Mở Flow ↗</button></div></div></div><div style="display:flex;justify-content:space-between;margin-top:18px"><button class="btn mini" data-act="prev" ${sceneIdx===0?'disabled':''}>← Trước</button><button class="btn mini dark" data-act="next" ${sceneIdx===p.count-1?'disabled':''}>Cảnh tiếp →</button></div></div></section><section class="panel"><div class="panel-head"><span class="number">05</span><div><h2>Xuất và sao lưu</h2><p>Copy prompt, lưu bản dự phòng</p></div></div><div class="panel-body"><div class="split"><button class="btn" data-act="export-txt">↓ Xuất TXT</button><button class="btn" data-act="export-json">↓ Xuất JSON</button><button class="btn" data-act="copy-all">◫ Copy toàn bộ</button><button class="btn light" data-act="save">✓ Lưu ngay</button></div><p class="muted">JSON lưu được cả ảnh đã thêm. Nếu xóa dữ liệu trang web thì dữ liệu có thể mất, nên xuất JSON định kỳ.</p></div></section></div></div><div class="banner"><div><strong>🎬 Sẵn sàng chuyển sang Google Flow?</strong><span>Copy prompt từng cảnh và chọn ảnh tham chiếu tương ứng trên Flow. Video MP4 được tạo tại Flow theo hạn mức tài khoản.</span></div><button class="btn primary" data-act="flow">Mở Google Flow ↗</button></div></div>`;}
function library(){return `<div class="content"><div class="eyebrow">✦ PROJECT LIBRARY</div><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div><h1 class="heading">Dự án của tôi</h1><p class="subheading">Quản lý và mở lại các kịch bản đã tạo</p></div><div class="row-actions"><label class="btn">↑ Nhập JSON<input class="hidden" id="import-file" type="file" accept=".json,application/json"></label><button class="btn primary" data-act="new">+ Dự án mới</button></div></div>${projects.map(p=>`<div class="project-row"><div><h3>📽️ ${escapeHtml(p.name)}</h3><p>${escapeHtml(p.product||'Chưa nhập tên sản phẩm')} · ${p.count} cảnh · ${escapeHtml(p.aspect)} · ${new Date(p.updated).toLocaleDateString('vi-VN')}</p></div><div class="row-actions"><button class="btn mini" data-act="clone" data-id="${p.id}" title="Nhân bản">◫</button><button class="btn mini" data-act="delete" data-id="${p.id}" title="Xóa">×</button><button class="btn mini primary" data-act="open" data-id="${p.id}">Mở →</button></div></div>`).join('')}<div class="tip">🔒 Dữ liệu được lưu trên máy hiện tại. Xuất JSON nếu muốn mang dự án và ảnh qua máy khác.</div></div>`;}
function guide(){return `<div class="content"><div class="eyebrow">✦ QUICK START</div><h1 class="heading">Hướng dẫn sử dụng</h1><p class="subheading">Làm video review 3–4 cảnh bằng Google Flow không cần API riêng.</p><div class="guide-grid"><div class="guide"><span class="guide-number">01</span><h3>Nhập ảnh & mô tả</h3><p>Chọn ảnh nhân vật và sản phẩm. Điền đặc điểm phải giữ đúng để prompt mô tả nhất quán.</p></div><div class="guide"><span class="guide-number">02</span><h3>Chỉnh 3–4 cảnh</h3><p>Thiết lập hành động, góc quay, giọng nói và ảnh đầu/cuối mỗi cảnh, sau đó copy prompt.</p></div><div class="guide"><span class="guide-number">03</span><h3>Tạo trên Google Flow</h3><p>Dán prompt, tải ảnh tham chiếu thủ công lên Flow và tạo video. Video có thể cần credit của Flow.</p></div></div><div class="panel" style="margin-top:24px"><div class="panel-body"><h2>Những lưu ý quan trọng</h2><p class="muted" style="font-size:12px;line-height:2">• Ứng dụng này chỉ chuẩn bị nội dung, không có nút tự xuất MP4.<br>• Prompt giúp tăng tính nhất quán nhưng không bảo đảm AI giữ sản phẩm và khuôn mặt giống 100%.<br>• Hình chỉ lưu trong trình duyệt; phải chọn ảnh gốc khi sử dụng Google Flow.<br>• Xuất JSON để sao lưu dự án hoặc đưa qua máy khác.<br>• Nếu tài khoản Google Flow cần credit, việc sử dụng Flow vẫn có thể tốn phí.</p><button class="btn primary" data-act="nav" data-view="studio">Bắt đầu →</button></div></div></div>`;}
function render(){const p=project();$('#root').innerHTML=`<div class="app"><aside class="side"><div class="brand"><div class="logo">✦</div><div><b>mo.flow<span style="color:#ff7357">.</span></b><br><small>CREATIVE STUDIO</small></div></div><div class="side-label">WORKSPACE</div><button class="nav ${view==='studio'?'active':''}" data-act="nav" data-view="studio">▣　 Trình tạo video</button><button class="nav ${view==='projects'?'active':''}" data-act="nav" data-view="projects">▤　 Dự án của tôi (${projects.length})</button><div class="side-label" style="margin-top:28px">CÔNG CỤ</div><button class="nav" data-act="nav" data-view="studio">✧　 Prompt Studio</button><button class="nav ${view==='guide'?'active':''}" data-act="nav" data-view="guide">ⓘ　 Hướng dẫn</button><div class="side-tip"><b>🌱 Không cần API</b>Tạo prompt, quản lý ảnh và kịch bản ngay trong trình duyệt, không cần nhập API key.</div><div class="side-foot">🔒 Dữ liệu chỉ lưu trên thiết bị này</div></aside><div class="main"><nav class="mobile-nav"><b>✦ mo.flow.</b><button data-act="nav" data-view="studio">Studio</button><button data-act="nav" data-view="projects">Dự án</button><button data-act="nav" data-view="guide">?</button></nav><header class="top"><span class="crumb">Workspace　›　 <strong>${view==='studio'?'Video Studio':view==='projects'?'Dự án của tôi':'Hướng dẫn'}</strong></span><div class="topright"><span id="save-status" class="saved">● ${persist}</span><button class="btn secondary" data-act="export-txt">↓ Xuất prompt</button><button class="btn primary" data-act="flow">▶ Mở Google Flow ↗</button></div></header>${view==='studio'&&p?studio():view==='projects'?library():guide()}</div></div>`;}
function download(text,name,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);}
const fname=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').toLowerCase()||'du-an';
function copy(text){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(()=>showToast('Đã copy nội dung')).catch(()=>fallbackCopy(text));}else fallbackCopy(text);}
function fallbackCopy(text){const el=document.createElement('textarea');el.value=text;el.style.position='fixed';el.style.left='-9999px';document.body.append(el);el.select();try{document.execCommand('copy');showToast('Đã copy nội dung');}catch{showToast('Không tự copy được; hãy chọn prompt và nhấn Ctrl+C.');}el.remove();}
async function imageData(file){if(!file.type.startsWith('image/'))throw Error('Chỉ chọn file ảnh');if(file.size>15*1024*1024)throw Error('Ảnh quá lớn, hãy chọn ảnh dưới 15MB');const raw=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);});const img=new Image();img.src=raw;await img.decode();const scale=Math.min(1,1200/Math.max(img.width,img.height));const cvs=document.createElement('canvas');cvs.width=Math.round(img.width*scale);cvs.height=Math.round(img.height*scale);cvs.getContext('2d').drawImage(img,0,0,cvs.width,cvs.height);return cvs.toDataURL('image/jpeg',.84);}
$('#root').addEventListener('click',async ev=>{const target=ev.target.closest('[data-act]');if(!target)return;const action=target.dataset.act,p=project(),s=current();if(action==='flow'){window.open(FLOW,'_blank','noopener,noreferrer');return;}if(action==='nav'){view=target.dataset.view;render();return;}if(action==='scene'){sceneIdx=Number(target.dataset.i);render();return;}if(action==='prev'||action==='next'){sceneIdx=Math.max(0,Math.min(p.count-1,sceneIdx+(action==='next'?1:-1)));render();return;}if(action==='aspect'){p.aspect=target.dataset.value;p.updated=Date.now();queueSave();render();return;}if(action==='new'){const n=makeProject(`Dự án ${projects.length+1}`);projects.unshift(n);active=n.id;sceneIdx=0;view='studio';queueSave();render();return;}if(action==='open'){active=target.dataset.id;sceneIdx=0;view='studio';queueSave();render();return;}if(action==='delete'){if(!confirm('Xóa dự án này? Không thể hoàn tác.'))return;projects=projects.filter(x=>x.id!==target.dataset.id);if(!projects.length)projects=[makeProject()];active=projects[0].id;queueSave();render();return;}if(action==='clone'){const src=projects.find(x=>x.id===target.dataset.id),n=structuredClone(src);n.id=uid();n.name+=' (bản sao)';n.updated=Date.now();projects.unshift(n);active=n.id;view='studio';sceneIdx=0;queueSave();render();return;}if(action==='remove-image'){p[target.dataset.which].splice(Number(target.dataset.i),1);queueSave();render();return;}if(action==='clear-frame'){s[target.dataset.which]='';queueSave();render();return;}if(action==='reset-prompt'){s.custom='';queueSave();render();showToast('Đã dùng prompt tạo tự động');return;}if(action==='copy-scene'){copy(promptFor(p,s,sceneIdx));return;}if(action==='copy-all'){copy(allPrompts(p));return;}if(action==='export-txt'){download(allPrompts(p),`${fname(p.name)}-prompts.txt`,'text/plain;charset=utf-8');return;}if(action==='export-json'){download(JSON.stringify(p,null,2),`${fname(p.name)}.json`,'application/json;charset=utf-8');return;}if(action==='save'){await save();showToast('Đã lưu dự án');return;}});
$('#root').addEventListener('input',ev=>{const t=ev.target,p=project(),s=current();if(t.id==='prompt-field'){s.custom=t.value;p.updated=Date.now();queueSave();return;}const k=t.dataset.field;if(!k)return;if(k.startsWith('scene.'))s[k.slice(6)]=t.value;else p[k]=t.value;p.updated=Date.now();queueSave();if(k==='product'||k==='description'||k==='preserve'||k.startsWith('scene.')){if(!s.custom){const preview=$('#prompt-field');if(preview&&preview!==t)preview.value=promptFor(p,s,sceneIdx);}}});
$('#root').addEventListener('change',async ev=>{const t=ev.target,p=project();if(t.dataset.field==='count'){p.count=Number(t.value);while(p.scenes.length<p.count)p.scenes.push(scene(p.scenes.length));p.scenes=p.scenes.slice(0,p.count);sceneIdx=0;queueSave();render();return;}if(t.dataset.field==='duration'){p.duration=Number(t.value);queueSave();render();return;}if(t.dataset.field==='voice'){p.voice=t.value;queueSave();render();return;}if(t.dataset.field==='style'){p.style=t.value;queueSave();render();return;}if(t.dataset.field==='goal'){p.goal=t.value;queueSave();render();return;}if(t.id==='import-file'){try{const f=t.files[0];if(!f)return;const data=JSON.parse(await f.text());if(!data.name||!Array.isArray(data.scenes)||!Array.isArray(data.products)||!Array.isArray(data.characters))throw Error('File không hợp lệ');const n={...makeProject(),...data,id:uid(),updated:Date.now()};if(![3,4].includes(n.scenes.length))throw Error('Số cảnh không hợp lệ');n.count=n.scenes.length;projects.unshift(n);active=n.id;view='studio';sceneIdx=0;queueSave();render();showToast('Đã nhập dự án');}catch{showToast('File JSON không đúng định dạng Mo Flow Studio');}return;}if(!t.dataset.upload)return;try{const type=t.dataset.upload,fs=Array.from(t.files||[]);if(fs.length===0)return;const images=[];for(const f of fs.slice(0,12))images.push(await imageData(f));if(type==='products'||type==='characters')p[type].push(...images);else current()[type]=images[0];p.updated=Date.now();queueSave();render();showToast(`Đã thêm ${images.length} ảnh`);}catch(e){showToast(e?.message||'Không đọc được hình');}});
(async()=>{try{db=await openDb();const data=await dbRead();if(data?.projects?.length){projects=data.projects;active=data.active||projects[0].id;}persist='Đã mở bộ nhớ';}catch{try{const d=JSON.parse(localStorage.getItem('moFlowOffline')||'null');if(d?.projects?.length){projects=d.projects;active=d.active||projects[0].id;}persist='Bộ nhớ dự phòng';}catch{persist='Không lưu được';}}if(!projects.length){projects=[makeSample()];active=projects[0].id;}if(!projects.find(p=>p.id===active))active=projects[0].id;render();queueSave();})();
})();
</script></body></html>
